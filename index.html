<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BULLET TRAIN — one-button arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: #0b1e33; height: 100%; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #7ec8f7; touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<script>
'use strict';
// BULLET TRAIN — one-button arcade.
// One prompt, one file: a bullet train speeds forward on three parallel tracks.
// Space / click / tap = switch to the next track. Dodge red barriers and slow
// freight trains, grab gold coins, 3 lives, speed keeps rising. Good luck.
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 1280, H = 720;

// ---- seeded RNG so the opening is identical every run (same seed, same start)
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
const SEED = parseInt(params.get('seed') || '7', 10);
const AUTO = params.get('auto') === '1';
let rng = mulberry32(SEED);

// ---- tracks
const LANES = [300, 430, 560]; // y of the three track centre lines
const TRACK_TOP = 250, TRACK_BOTTOM = 610;
const TRAIN_X = 230;

// ---- game state
let state = 'ready'; // ready | playing | over
let score = 0, coins = 0, lives = 3;
let speed = 7;            // px per frame of world scroll
let distance = 0;         // metres travelled
let lane = 1;             // current lane index 0..2
let laneY = LANES[1];     // animated y
let invuln = 0;           // frames of post-hit invulnerability
let shake = 0;            // screen shake frames
let flash = 0;            // red flash frames
let time = 0;
let spawnTimer = 0;
let obstacles = [];       // {lane, x, w, kind: 'barrier' | 'freight', hit}
let pickups = [];         // {lane, x, taken}
let clouds = [];
let poles = [];
let trees = [];
let popups = [];          // floating "+10" texts {x, y, life, text}

function resetWorld() {
  rng = mulberry32(SEED);
  score = 0; coins = 0; lives = 3;
  speed = 7; distance = 0;
  lane = 1; laneY = LANES[1];
  invuln = 0; shake = 0; flash = 0; time = 0;
  spawnTimer = 40;
  obstacles = []; pickups = []; popups = [];
  clouds = [];
  for (let i = 0; i < 7; i++) clouds.push({ x: rng() * W, y: 30 + rng() * 130, s: 0.6 + rng() * 0.9, v: 0.3 + rng() * 0.4 });
  poles = [];
  for (let i = 0; i < 6; i++) poles.push({ x: i * 260 });
  trees = [];
  for (let i = 0; i < 9; i++) trees.push({ x: rng() * W, lane: Math.floor(rng() * 3), s: 0.8 + rng() * 0.5 });
}

function switchTrack() {
  if (state !== 'playing') return;
  lane = (lane + 1) % 3;
}

function startGame() {
  resetWorld();
  state = 'playing';
}

function gameOver() {
  state = 'over';
}

function spawnRow() {
  // Pick a pattern: never block all three lanes at the same x.
  const roll = rng();
  const freeLane = Math.floor(rng() * 3);
  const x = W + 80;
  if (roll < 0.45) {
    // one barrier on a random lane (not the free one), maybe a coin elsewhere
    const bl = (freeLane + 1 + Math.floor(rng() * 2)) % 3;
    obstacles.push({ lane: bl, x: x, w: 46, kind: 'barrier' });
    if (rng() < 0.7) pickups.push({ lane: freeLane, x: x + 60, taken: false });
  } else if (roll < 0.75) {
    // a slow freight train on one lane + a barrier on another, one lane free
    const fl = (freeLane + 1 + Math.floor(rng() * 2)) % 3;
    const bl = (freeLane + 2 + Math.floor(rng() * 2)) % 3;
    obstacles.push({ lane: fl, x: x, w: 260, kind: 'freight' });
    if (bl !== fl) obstacles.push({ lane: bl, x: x + 30, w: 46, kind: 'barrier' });
    if (rng() < 0.6) pickups.push({ lane: freeLane, x: x + 200, taken: false });
  } else {
    // coin run: 3-5 coins in a line on the free lane
    const n = 3 + Math.floor(rng() * 3);
    for (let i = 0; i < n; i++) pickups.push({ lane: freeLane, x: x + i * 70, taken: false });
    if (rng() < 0.5) {
      const bl = (freeLane + 1 + Math.floor(rng() * 2)) % 3;
      obstacles.push({ lane: bl, x: x + 120, w: 46, kind: 'barrier' });
    }
  }
}

function update() {
  time++;
  if (state !== 'playing') return;
  // speed ramps up with distance: +1 every ~400 m, cap 16
  speed = Math.min(16, 7 + Math.floor(distance / 400));
  distance += speed * 0.12;
  score = Math.floor(distance) + coins * 10;

  // smooth lane change
  laneY += (LANES[lane] - laneY) * 0.25;

  // scenery scroll
  for (const c of clouds) { c.x -= c.v; if (c.x < -160) { c.x = W + 40; c.y = 30 + rng() * 130; } }
  for (const p of poles) { p.x -= speed; if (p.x < -20) p.x += 6 * 260; }
  for (const t of trees) { t.x -= speed * 0.85; if (t.x < -60) { t.x = W + 60; t.lane = Math.floor(rng() * 3); } }

  // spawn rows
  spawnTimer -= speed;
  if (spawnTimer <= 0) {
    spawnRow();
    spawnTimer = 520 + rng() * 260;
  }

  // move obstacles + pickups
  for (const o of obstacles) o.x -= speed;
  for (const p of pickups) p.x -= speed;
  obstacles = obstacles.filter(o => o.x + o.w > -80);
  pickups = pickups.filter(p => !p.taken && p.x > -40);

  // collisions
  const trainL = TRAIN_X - 95, trainR = TRAIN_X + 105;
  if (invuln > 0) invuln--;
  if (shake > 0) shake--;
  if (flash > 0) flash--;
  for (const o of obstacles) {
    if (o.lane !== lane || o.hit) continue;
    if (o.x < trainR && o.x + o.w > trainL) {
      o.hit = true;
      if (invuln <= 0) {
        lives--;
        invuln = 90;
        shake = 18;
        flash = 12;
        if (lives <= 0) { gameOver(); return; }
      }
    }
  }
  for (const p of pickups) {
    if (p.taken || p.lane !== lane) continue;
    if (p.x > trainL - 20 && p.x < trainR + 20) {
      p.taken = true;
      coins++;
      popups.push({ x: p.x, y: LANES[p.lane] - 46, life: 40, text: '+10' });
    }
  }
  for (const pp of popups) { pp.y -= 1.2; pp.life--; }
  popups = popups.filter(pp => pp.life > 0);

  if (AUTO) autopilot();
}

function autopilot() {
  // Look ahead: if the current lane is blocked within ~420 px, move to a free lane.
  // Prefer the free lane with a coin coming up.
  const ahead = 430;
  const blocked = obstacles.some(o => o.lane === lane && !o.hit && o.x > TRAIN_X && o.x < TRAIN_X + ahead);
  if (!blocked) return;
  const free = [0, 1, 2].filter(l => l !== lane && !obstacles.some(o => o.lane === l && !o.hit && o.x > TRAIN_X - 60 && o.x < TRAIN_X + ahead));
  if (!free.length) return;
  const withCoin = free.find(l => pickups.some(p => !p.taken && p.lane === l && p.x > TRAIN_X && p.x < TRAIN_X + ahead + 160));
  const target = withCoin !== undefined ? withCoin : free[0];
  // switchTrack cycles 0->1->2->0; step toward target one press at a time
  const want = (lane + 1) % 3;
  if (want === target || (lane + 2) % 3 === target) switchTrack();
}

// ---- drawing
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackground() {
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, 260);
  sky.addColorStop(0, '#4aa8f0');
  sky.addColorStop(1, '#a8dcff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, 250);
  // sun
  ctx.fillStyle = '#ffd94d';
  ctx.beginPath(); ctx.arc(1120, 80, 44, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255, 217, 77, 0.35)';
  ctx.beginPath(); ctx.arc(1120, 80, 62, 0, Math.PI * 2); ctx.fill();
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  for (const c of clouds) {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 52 * c.s, 20 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x + 34 * c.s, c.y + 6 * c.s, 36 * c.s, 16 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x - 36 * c.s, c.y + 7 * c.s, 32 * c.s, 14 * c.s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // hills
  ctx.fillStyle = '#7cc46a';
  ctx.beginPath();
  ctx.moveTo(0, 250);
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 226 + Math.sin((x + time * 0.2) * 0.008) * 12);
  ctx.lineTo(W, 250); ctx.closePath(); ctx.fill();
  // fields
  ctx.fillStyle = '#8ed081';
  ctx.fillRect(0, 250, W, H - 250);
  ctx.fillStyle = '#7cc46a';
  ctx.fillRect(0, 250, W, 8);
}

function drawTracks() {
  // ballast beds
  for (let i = 0; i < 3; i++) {
    const y = LANES[i];
    ctx.fillStyle = '#9a8f80';
    ctx.fillRect(0, y - 26, W, 52);
    ctx.fillStyle = '#6b5d4f';
    ctx.fillRect(0, y - 26, W, 6);
    ctx.fillRect(0, y + 20, W, 6);
    // sleepers
    ctx.fillStyle = '#5d4a36';
    const off = (time * speed) % 46;
    for (let x = -off; x < W; x += 46) ctx.fillRect(x, y - 18, 26, 36);
    // rails
    ctx.fillStyle = '#c8ccd2';
    ctx.fillRect(0, y - 13, W, 5);
    ctx.fillRect(0, y + 8, W, 5);
    ctx.fillStyle = '#8f959c';
    ctx.fillRect(0, y - 8, W, 2);
    ctx.fillRect(0, y + 13, W, 2);
  }
  // telegraph poles above the top track
  for (const p of poles) {
    ctx.fillStyle = '#6b4a2f';
    ctx.fillRect(p.x, 168, 8, 84);
    ctx.fillRect(p.x - 22, 176, 52, 7);
    ctx.strokeStyle = '#4a3421';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p.x - 22, 179); ctx.lineTo(p.x + 238, 179); ctx.stroke();
  }
  // trees between tracks
  for (const t of trees) {
    const y = LANES[t.lane] + 74 * (t.lane === 2 ? -1 : 1) * 0 + 66;
    ctx.fillStyle = '#5a3d24';
    ctx.fillRect(t.x - 3, y - 8, 7, 26);
    ctx.fillStyle = '#3f9e4d';
    ctx.beginPath(); ctx.arc(t.x, y - 22, 24 * t.s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#57b368';
    ctx.beginPath(); ctx.arc(t.x - 8, y - 30, 14 * t.s, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTrain() {
  const y = laneY;
  const bob = state === 'playing' ? Math.sin(time * 0.35) * 1.5 : 0;
  ctx.save();
  if (invuln > 0 && state === 'playing' && Math.floor(time / 6) % 2 === 0) ctx.globalAlpha = 0.45;
  ctx.translate(TRAIN_X, y + bob);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(0, 34, 108, 9, 0, 0, Math.PI * 2); ctx.fill();
  // body — sleek bullet nose to the right
  const body = ctx.createLinearGradient(0, -30, 0, 30);
  body.addColorStop(0, '#ffffff');
  body.addColorStop(0.55, '#f2f4f7');
  body.addColorStop(1, '#d7dde3');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-100, -28);
  ctx.lineTo(58, -28);
  ctx.quadraticCurveTo(104, -26, 108, 0);
  ctx.quadraticCurveTo(104, 26, 58, 28);
  ctx.lineTo(-100, 28);
  ctx.closePath(); ctx.fill();
  // red nose + blue stripe
  ctx.fillStyle = '#e63946';
  ctx.beginPath();
  ctx.moveTo(58, -28);
  ctx.quadraticCurveTo(104, -26, 108, 0);
  ctx.quadraticCurveTo(104, 26, 58, 28);
  ctx.lineTo(58, 14);
  ctx.quadraticCurveTo(88, 12, 90, 0);
  ctx.quadraticCurveTo(88, -12, 58, -14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1d6fd1';
  ctx.fillRect(-100, 6, 168, 9);
  // windows
  ctx.fillStyle = '#17324f';
  for (let i = 0; i < 5; i++) roundRect(-88 + i * 30, -20, 22, 14, 4), ctx.fill();
  // headlight
  ctx.fillStyle = '#ffe66d';
  ctx.beginPath(); ctx.arc(96, 2, 6, 0, Math.PI * 2); ctx.fill();
  // wheels / bogies
  ctx.fillStyle = '#2b2f36';
  ctx.fillRect(-84, 26, 46, 10);
  ctx.fillRect(28, 26, 46, 10);
  ctx.fillStyle = '#454b54';
  ctx.beginPath(); ctx.arc(-61, 38, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-47, 38, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(51, 38, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(65, 38, 8, 0, Math.PI * 2); ctx.fill();
  // speed lines
  if (state === 'playing') {
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const lx = -118 - ((time * (speed + 6) + i * 55) % 160);
      ctx.beginPath(); ctx.moveTo(lx, -18 + i * 16); ctx.lineTo(lx + 34, -18 + i * 16); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawObstacles() {
  for (const o of obstacles) {
    if (o.kind === 'barrier') {
      const y = LANES[o.lane];
      ctx.fillStyle = '#c1121f';
      roundRect(o.x, y - 34, o.w, 68, 6); ctx.fill();
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 3; i++) ctx.fillRect(o.x + 4, y - 26 + i * 20, o.w - 8, 9);
      ctx.fillStyle = '#7f0d18';
      ctx.beginPath(); ctx.arc(o.x + o.w / 2, y - 40, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff5d5d';
      ctx.beginPath(); ctx.arc(o.x + o.w / 2, y - 40, 5, 0, Math.PI * 2); ctx.fill();
    } else {
      // freight train: long grey box with containers
      const y = LANES[o.lane];
      ctx.fillStyle = '#3c4148';
      roundRect(o.x - 10, y - 30, o.w + 20, 60, 8); ctx.fill();
      const cols = ['#b5541e', '#2e6db4', '#5a7d2a', '#8a5a9e'];
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = cols[i % 4];
        ctx.fillRect(o.x + 6 + i * 86, y - 24, 78, 48);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        for (let s = 0; s < 4; s++) ctx.fillRect(o.x + 12 + i * 86 + s * 20, y - 24, 3, 48);
      }
      ctx.fillStyle = '#22262c';
      ctx.fillRect(o.x - 10, y + 26, o.w + 20, 8);
    }
  }
}

function drawPickups() {
  for (const p of pickups) {
    if (p.taken) continue;
    const y = LANES[p.lane] + Math.sin(time * 0.12 + p.x * 0.05) * 5;
    ctx.fillStyle = '#ffcf3f';
    ctx.beginPath(); ctx.arc(p.x, y, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8a91c';
    ctx.beginPath(); ctx.arc(p.x, y, 16, 0, Math.PI * 2); ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#8a6410';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('★', p.x, y + 1);
  }
}

function drawHUD() {
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  // score panel
  ctx.fillStyle = 'rgba(8, 24, 44, 0.82)';
  roundRect(18, 14, 300, 76, 12); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillText('SCORE ' + score, 34, 48);
  ctx.font = 'bold 18px sans-serif';
  ctx.fillStyle = '#ffd94d';
  ctx.fillText('★ ' + coins + ' coins', 34, 76);
  // speed panel
  ctx.fillStyle = 'rgba(8, 24, 44, 0.82)';
  roundRect(W - 268, 14, 250, 76, 12); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillText(Math.round(speed * 42) + ' km/h', W - 252, 48);
  ctx.font = 'bold 18px sans-serif';
  ctx.fillStyle = '#9fd8ff';
  ctx.fillText(Math.floor(distance) + ' m', W - 252, 76);
  // lives hearts
  ctx.font = '34px sans-serif';
  ctx.textAlign = 'center';
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < lives ? '#ff4d6d' : 'rgba(255,255,255,0.35)';
    ctx.fillText('♥', W / 2 - 44 + i * 44, 56);
  }
  // popups
  ctx.font = 'bold 24px sans-serif';
  for (const pp of popups) {
    ctx.globalAlpha = Math.min(1, pp.life / 20);
    ctx.fillStyle = '#ffd94d';
    ctx.fillText(pp.text, pp.x, pp.y);
    ctx.globalAlpha = 1;
  }
  // hint
  if (state === 'playing') {
    ctx.fillStyle = 'rgba(8, 24, 44, 0.65)';
    roundRect(W / 2 - 190, H - 44, 380, 32, 10); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 17px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SPACE / TAP — switch track', W / 2, H - 22);
  }
}

function drawReady() {
  ctx.fillStyle = 'rgba(8, 24, 44, 0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 84px sans-serif';
  ctx.fillText('BULLET TRAIN', W / 2, 250);
  ctx.fillStyle = '#ffd94d';
  ctx.font = 'bold 34px sans-serif';
  ctx.fillText('One button. Three tracks. Don\'t stop.', W / 2, 310);
  ctx.fillStyle = '#ffffff';
  ctx.font = '28px sans-serif';
  ctx.fillText('SPACE / CLICK / TAP — switch to the next track', W / 2, 390);
  ctx.fillText('Dodge red barriers & freight trains — grab gold coins', W / 2, 432);
  ctx.fillStyle = '#9fd8ff';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillText('Press SPACE or TAP to start', W / 2, 510);
}

function drawOver() {
  ctx.fillStyle = 'rgba(8, 24, 44, 0.62)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff5d5d';
  ctx.font = 'bold 76px sans-serif';
  ctx.fillText('GAME OVER', W / 2, 260);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 44px sans-serif';
  ctx.fillText('Score  ' + score, W / 2, 340);
  ctx.font = '28px sans-serif';
  ctx.fillStyle = '#ffd94d';
  ctx.fillText('★ ' + coins + ' coins   •   ' + Math.floor(distance) + ' m   •   top speed ' + Math.round(16 * 42) + ' km/h', W / 2, 396);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillText('Press R or TAP to ride again', W / 2, 480);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  drawTracks();
  drawPickups();
  drawObstacles();
  drawTrain();
  ctx.restore();
  if (flash > 0) {
    ctx.fillStyle = 'rgba(230, 30, 30,' + (flash / 24) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
  if (state === 'ready') drawReady();
  if (state === 'over') drawOver();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function press() {
  if (state === 'ready') { startGame(); return; }
  if (state === 'over') { startGame(); return; }
  switchTrack();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); press(); }
  if (e.code === 'KeyR' && state === 'over') startGame();
});
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });

// expose state for playtests / capture
window.__bt = {
  get state() { return state; },
  get score() { return score; },
  get coins() { return coins; },
  get lives() { return lives; },
  get lane() { return lane; },
  get distance() { return distance; },
  start: startGame,
  press: press,
};

resetWorld();
loop();
</script>
</body>
</html>
